[package]
name = "meetnote-llm"
version = "0.1.0"
edition = "2021"
description = "Turns sparse live notes into a full note, using the transcript as evidence."

[dependencies]
meetnote-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
