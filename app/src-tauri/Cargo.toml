[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# tauri-runtime 2.6 added trait methods that tauri-runtime-wry 2.4 (the newest
# published) does not implement. Pin until wry catches up.
tauri-runtime = "=2.4.0"
tauri-plugin-opener = "2"
# The call prompt, for when the panel is out of sight.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
meetnote-core = { path = "../../core" }
chrono = "0.4"
# For SIGINT: the sidecar finalises its wav files on interrupt, and a plain
# kill() would leave them truncated.
libc = "0.2"
dirs = "5"
meetnote-stt = { path = "../../stt" }
meetnote-llm = { path = "../../llm" }
meetnote-diarize = { path = "../../diarize" }
reqwest = { version = "0.12", features = ["blocking"] }

# To float the call panel over a full-screen meeting, which Tauri's window
# options can't do. Same versions tao already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPanel", "NSWindow", "NSResponder"] }

